<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* <!--transform is a CSS property that allows you to rotate, scale, skew, or translate an element-->
        <!--transition is a CSS property that allows you to control the duration and timing of CSS transitions --> */
       
        .square{
            width: 100px;
            height: 100px;
            background-color: blue;
        }
        .square:hover{
            background-color: red;
                transform: rotate(360deg);
                transition: all 2s 0.1s;
        }
    </style>
</head>
<body>
    <div class="square"></div>

</body>
</html>
