<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Table: collection of rows & columns -->
    <table border="1" cellpadding="4">
        <!-- Table header -->
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Apple</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Mango</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Grapes</td>
                <td>8</td>
            </tr>
            <tr>
                <td><b>Total</b></td>
                <td><b>23</b></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
