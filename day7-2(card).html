<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Square Card Example</title>
  <style>
    .card {
      width: 200px;          /* square width */
      height: 200px;         /* square height */
      background-color: #e0f7fa;
      border: 2px solid #00796b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 18px;
      margin: 50px auto;     /* center on page */
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  
  <div class="card">
    Hello, I am a Square Card!
  </div>
</body>
</html>
