<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crawlers vs Scrapers</title>
</head>
<body>
     <!--iframe is used to embed another HTML page within the current page-->
    <iframe src="day4-2.html" width="100%" height="600px" style="border:none;"></iframe>
    <center>
        <iframe src="day5-1.html" width="100%" height="600"></iframe>
    </center>
    <!-- Web Crawlers 🕷️ -->
    <!-- Crawlers automated bots hote hain jo websites ko systematically visit karte hain -->
    <!-- Purpose: Search engines ke liye pages discover + index karna -->
    <!-- Example: Googlebot, Bingbot -->
    
    <!-- Web Scrapers 📑 -->
    <!-- Scrapers programs hote hain jo specific data extract karte hain -->
    <!-- Purpose: Price comparison, data analysis, research -->
    <!-- Example: BeautifulSoup (Python), Scrapy framework -->
    
    <!-- Difference -->
    <!-- Crawlers: Discover + Index (Entire site) -->
    <!-- Scrapers: Extract + Reuse (Specific data) -->
</body>
</html>
