<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--flex is a CSS layout model that allows you to design flexible and responsive layouts by defining how child elements 
    are distributed within their container -->
    <!--grid is another CSS layout model that allows you to create complex, two-dimensional layouts by defining rows and columns -->
    <!--inline-flex is a CSS layout model that allows you to create flexible and responsive layouts by defining how child 
    elements are distributed within their container, but with inline behavior -->

    <!--parent div-->
    <div style="display: flex;">
        <!--child div-->
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <!--parent div-->
    <div style="display: flex;">
        <!--child div-->
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <div style="display: inline-flex;">
        <!--child div-->
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

    <div style="display: inline-flex;">
        <!--child div-->
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    <br/>
    <br/>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr ;gap: 10px;">
        <div style="
            height: 50px;
            width: 50px;
            background-color: red;">
        </div>
    
        
        <div style="
            height: 50px;
            width: 50px;
            background-color: red;">
        </div>
    
        
        <div style="
            height: 50px;
            width: 50px;
            background-color: red;">
        
    </div>


</body>
</html>
