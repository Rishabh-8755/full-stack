<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Absolute will be relative to its parent container-->
    <div
    style="width: 100px; height: 100px; background-color: rgb(173, 230, 191);
    position: relative;">
    </div>

    <div style="width: 100px; height: 100px; background-color: lightblue;
     position: absolute; margin-left: 20px;">
    </div>
    <div style="width: 100px; height: 100px; background-color: lightblue;
     position: fixed; margin-left: 40px;">

    </div>

</body>
</html>
