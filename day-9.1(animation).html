<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div{
        height: 100px;
        width: 100px;
        background-color: red;
    }
    div:hover{
        background-color: blue;
    }
    /* <!--:active is triggered when an element is being activated (e.g., clicked)--> */
    div:active{
        background-color: green;
    }
    /* <!--focus is triggered when an element receives keyboard focus--> */
    input:focus{
        background-color: yellow;
    }

    </style>
</head>
<body>
    <!--sudo classes is target element standing intraction it is represented by-->

    <div></div>
</body>
</html>
